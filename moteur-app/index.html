<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircaFrax — Moteur EPROM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
:root{--bg:#fcfbf8}
body{background:var(--bg)}
.card{border:1px solid #e5e7eb;border-radius:14px;padding:16px;background:white}
.tag{font-size:11px;background:#f3f4f6;padding:2px 8px;border-radius:20px;margin-right:4px}
.score{font-weight:700}
</style>
</head>
<body>
<main class="container">
<h1>CircaFrax — Moteur EPROM</h1>
<p>Outils libres • Fiches vérifiées • Hors ligne</p>
<input type="search" id="q" placeholder="Rechercher : savoir, service-public, gouv.fr..." autofocus>
<div id="stats" style="margin:10px 0;color:#6b7280;font-size:13px"></div>
<div id="results" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"></div>
<pre id="debug" style="margin-top:20px;background:#111;color:#eee;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap"></pre>
</main>
<script src="js/search.js"></script>
</body>
</html>

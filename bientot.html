        :root {
          --navy:#0a1228;
          --gold:#d4af37;
          --bg:#fcfbf8;
          --bg-soft:#fffdf3;
          --bg-paper:#fbfaf7;
          --border:rgba(10,18,40,0.08);
          --text:#0a1228;
          --muted:#6b7280;
        }
        *{box-sizing:border-box}
        body{
          margin:0;
          font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
          background:var(--bg);
          color:var(--text);
          line-height:1.7;
        }
        a{color:inherit;text-decoration:none}
        .serif{font-family:Georgia, 'Times New Roman', serif;letter-spacing:-0.02em}
        .site-header{
          position:sticky;top:0;z-index:30;
          background:rgba(255,255,255,0.88);
          backdrop-filter:blur(12px);
          border-bottom:1px solid var(--border);
        }
        .header-inner{
          max-width:1100px;margin:0 auto;
          padding:0 24px;height:68px;
          display:flex;align-items:center;justify-content:space-between;
        }
        .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
        .logo img{width:32px;height:32px;object-fit:contain;border-radius:8px;background:#fffdf3;border:1px solid var(--border)}
        .site-nav{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
        .site-nav a{font-size:13.5px;font-weight:500;color:#334155;padding:7px 0;border-bottom:2px solid transparent;transition:.2s}
        .site-nav a:hover{color:var(--navy)}
        .site-nav a.active{color:var(--navy);border-bottom-color:var(--gold)}
        .wrap{max-width:1100px;margin:0 auto;padding:0 24px}
        .footer-hr{border:none;height:3px;background:linear-gradient(to right,#0a1228,#d4af37);border-radius:2px;margin:0 0 28px}
        .site-footer{background:#fbfaf7;border-top:1px solid var(--border);padding:32px 0 44px;margin-top:56px}
        .footer-grid{display:grid;grid-template-columns:1.4fr .8fr .9fr .9fr;gap:32px;font-size:13.5px;color:var(--muted)}
        .footer-grid h4{margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
        .footer-grid a{display:block;padding:4px 0}
        .footer-grid a:hover{color:var(--navy)}
        .footer-brand img{width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid var(--border);vertical-align:middle;margin-right:8px}
        .btn{
          display:inline-flex;align-items:center;justify-content:center;
          padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;
          background:var(--navy);color:#fff;border:1px solid var(--navy);
          cursor:pointer;transition:.2s;user-select:none;
        }
        .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px -16px rgba(10,18,40,0.5)}
        .btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
        .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--border)}
        .btn-ghost:hover{border-color:var(--navy)}
        .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
        @media(max-width:880px){
          .header-inner{height:auto;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 24px}
          .footer-grid{grid-template-columns:1fr 1fr}
        }
        /* page specifique */
        .bientot-hero{
          padding:64px 0 24px;
          background:radial-gradient(120% 120% at 20% 0%,#fffdf3 0%,#fcfbf8 55%,#fbfaf7 100%);
        }
        .badge{
          display:inline-flex;background:var(--navy);color:#fff;
          font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
          padding:6px 12px;border-radius:999px;margin-bottom:18px
        }
        .card{
          background:#fff;
          border:1px solid var(--border);
          border-radius:20px;
          padding:22px;
          box-shadow:0 12px 32px -20px rgba(10,18,40,0.25);
        }
        .choice-btn{
          display:flex;flex-direction:column;align-items:flex-start;gap:10px;
          width:100%;text-align:left;
          border-radius:18px;padding:14px;
          border:1px solid var(--border);
          background:#fff;
          cursor:pointer;
          transition:.2s;
          box-shadow:0 12px 32px -22px rgba(10,18,40,0.2);
        }
        .choice-btn.active{
          border-color:var(--gold);
          background:var(--bg-soft);
          box-shadow:0 12px 28px -18px rgba(212,175,55,0.5);
        }
        .choice-thumb{
          width:100%;aspect-ratio:16/10;border-radius:12px;
          border:1px solid var(--border);
          overflow:hidden;position:relative;
          background:#fffdf3;
        }
        .puzzle-wrap{
          width:100%;max-width:500px;aspect-ratio:1/1;
          border-radius:24px;
          border:1px solid var(--border);
          background:var(--bg-paper);
          box-shadow:0 18px 40px -24px rgba(10,18,40,0.35);
          overflow:hidden;
          position:relative;
        }
        .puzzle-grid{
          display:grid;
          width:100%;height:100%;gap:2px;background:rgba(10,18,40,0.06);padding:2px;
        }
        .tile{
          position:relative;
          border-radius:10px;
          overflow:hidden;
          cursor:pointer;
          background:#fff;
          border:1px solid rgba(10,18,40,0.06);
          transition:transform .12s ease, filter .12s;
          display:flex;align-items:flex-end;justify-content:flex-end;
          padding:6px;
        }
        .tile:active{transform:scale(.96)}
        .tile.empty{
          background:transparent;
          border:1px dashed rgba(10,18,40,0.15);
          cursor:default;
          box-shadow:inset 0 0 0 1px rgba(255,255,255,0.6);
        }
        .tile-number{
          font-size:10px;font-weight:700;
          background:rgba(10,18,40,0.78);color:#fff;
          padding:2px 6px;border-radius:999px;
          letter-spacing:.04em;
        }
        .preview-full{
          width:100%;height:100%;position:relative;
          background-size:cover;background-position:center;
          display:flex;align-items:center;justify-content:center;
        }
        .stats{
          display:flex;gap:10px;flex-wrap:wrap;margin-top:12px
        }
        .stat{
          display:inline-flex;align-items:center;gap:8px;
          background:#fff;border:1px solid var(--border);
          border-radius:999px;padding:8px 14px;
          font-size:13px;font-weight:600;color:var(--navy);
          box-shadow:0 8px 20px -18px rgba(10,18,40,0.3)
        }
        .win-banner{
          margin-top:18px;
          background:linear-gradient(135deg,#0a1228 0%,#162447 60%,#d4af37 130%);
          color:#fff;border-radius:16px;padding:16px 18px;
          display:flex;align-items:center;gap:12px;
          animation:pop .4s ease;
          position:relative;overflow:hidden;
        }
        @keyframes pop{0%{transform:translateY(6px) scale(.98);opacity:0}100%{transform:none;opacity:1}}
        .level-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .level-btn{
          text-align:left;
          border-radius:16px;
          padding:12px 14px;
          border:1px solid var(--border);
          background:#fff;
          cursor:pointer;
          transition:.18s;
          position:relative;
          box-shadow:0 8px 22px -20px rgba(10,18,40,.3);
        }
        .level-btn.active{
          border-color:var(--navy);
          background:#fffdf3;
          box-shadow:0 12px 28px -18px rgba(10,18,40,.25);
        }
        .level-badge{
          display:inline-flex;
          font-size:10px;font-weight:700;letter-spacing:.06em;
          padding:3px 8px;border-radius:999px;
          margin-bottom:6px;
        }
        .confetti{
          position:absolute;inset:0;pointer-events:none;overflow:hidden;
        }
        .confetti span{
          position:absolute;width:8px;height:8px;border-radius:2px;
          animation:confFall 1.2s ease-out forwards;
        }
        @keyframes confFall{
          0%{transform:translateY(-20px) rotate(0) scale(1);opacity:1}
          100%{transform:translateY(220px) rotate(360deg) scale(.8);opacity:0}
        }
        @media(max-width:880px){
          .two-col{grid-template-columns:1fr !important}
          .puzzle-wrap{max-width:100%}
          .level-grid{grid-template-columns:1fr}
        }
